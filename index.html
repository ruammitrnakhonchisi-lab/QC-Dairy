<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f6e4f">
<title>QC Precast — ระบบตรวจสอบคุณภาพ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header class="topbar" id="topbar">
    <button class="icon-btn" id="btnBack" hidden aria-label="ย้อนกลับ">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="topbar-title">
      <span id="topbarTitle">QC Precast</span>
      <span id="topbarSubtitle" class="topbar-subtitle"></span>
    </div>
    <span class="sync-badge online" id="syncBadge" hidden><span class="dot"></span><span id="syncBadgeText">ออนไลน์</span></span>
    <button class="icon-btn" id="btnMenuAction" hidden aria-label="เมนู">⋮</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-item" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5M6 10v9h5v-5h2v5h5v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>หน้าหลัก</span>
    </button>
    <button class="tab-item" data-tab="new">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>ตรวจใหม่</span>
    </button>
    <button class="tab-item" data-tab="history">
      <svg viewBox="0 0 24 24"><path d="M4 4v6h6M4.6 15a8 8 0 1 0 1.8-8.4L4 10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>ประวัติ</span>
    </button>
    <button class="tab-item" data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l2-1.6-2-3.4-2.4.6a8 8 0 0 0-1.7-1L15 3h-4l-.3 2.6a8 8 0 0 0-1.7 1l-2.4-.6-2 3.4L6.6 11a7.9 7.9 0 0 0 0 2l-2 1.6 2 3.4 2.4-.6a8 8 0 0 0 1.7 1L11 21h4l.3-2.6a8 8 0 0 0 1.7-1l2.4.6 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span>ตั้งค่า</span>
    </button>
  </nav>

</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="main.js"></script>
</body>
</html>
